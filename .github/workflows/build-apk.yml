name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install

      - name: Copy PDF engine into the app
        run: node prepare.js

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Let the app find the phone's speech engine
        run: |
          sed -i 's#</manifest>#    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "TTS_SERVICE" android/app/src/main/AndroidManifest.xml

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Reader-Aloud-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
